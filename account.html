<!DOCTYPE html>
<html lang='ru'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Аккаунт и очки опыта</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; background: #1e1e2e; color: #fff; padding: 0 12px; }
  h1 { margin-top: 40px; }
  input { display: block; margin: 8px auto; padding: 10px; width: 260px; font-size: 16px; border-radius: 6px; border: none; }
  button { padding: 10px 18px; margin: 6px; font-size: 16px; cursor: pointer; border-radius: 6px; border: none; background: #89b4fa; color: #1e1e2e; }
  button:hover { background: #b4befe; }
  #msg { color: #f9e2af; min-height: 24px; }
  #xp { font-size: 28px; font-weight: bold; color: #a6e3a1; }
  ol { display: inline-block; text-align: left; }
  a { color: #89b4fa; }
</style>
</head>
<body>
<h1>Аккаунт</h1>
<div id='msg'></div>

<div id='auth'>
  <input id='email' type='email' placeholder='Почта'>
  <input id='password' type='password' placeholder='Пароль (минимум 6 символов)'>
  <button id='login'>Войти</button>
  <button id='signup'>Регистрация</button>
</div>

<div id='profile' hidden>
  <p>Привет, <b id='name'></b>!</p>
  <p>Твой опыт: <span id='xp'>0</span> XP</p>
  <button id='addxp'>+10 XP (тест)</button>
  <button id='logout'>Выйти</button>
</div>

<h2>Лучшие игроки</h2>
<ol id='top'></ol>
<p><a href='index.html'>На главную</a></p>

<script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js'></script>
<script>
  const sb = supabase.createClient(
    'https://ammowgdvsmcudcovrwpi.supabase.co',
    'sb_publishable_GhP6LAnIH1Yv8kQkfKd0ZQ_JMPONjR2'
  );
  const $ = id => document.getElementById(id);
  function msg(t) { $('msg').textContent = t || ''; }

  async function loadTop() {
    const { data } = await sb.from('profiles').select('username,xp').order('xp', { ascending: false }).limit(10);
    const ol = $('top');
    ol.innerHTML = '';
    (data || []).forEach(p => {
      const li = document.createElement('li');
      li.textContent = p.username + ': ' + p.xp + ' XP';
      ol.appendChild(li);
    });
  }

  async function refresh() {
    const { data: { session } } = await sb.auth.getSession();
    $('auth').hidden = !!session;
    $('profile').hidden = !session;
    if (session) {
      const { data } = await sb.from('profiles').select('username,xp').eq('id', session.user.id).single();
      if (data) {
        $('name').textContent = data.username;
        $('xp').textContent = data.xp;
      }
    }
    loadTop();
  }

  $('signup').onclick = async () => {
    const { error } = await sb.auth.signUp({ email: $('email').value, password: $('password').value });
    msg(error ? error.message : 'Готово! Если включено подтверждение почты, проверь письмо.');
    refresh();
  };

  $('login').onclick = async () => {
    const { error } = await sb.auth.signInWithPassword({ email: $('email').value, password: $('password').value });
    msg(error ? error.message : '');
    refresh();
  };

  $('logout').onclick = async () => {
    await sb.auth.signOut();
    refresh();
  };

  $('addxp').onclick = async () => {
    const { error } = await sb.rpc('add_xp', { amount: 10 });
    msg(error ? error.message : '+10 XP!');
    refresh();
  };

  refresh();
</script>
</body>
</html>
